<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Consultin - Plataforma de gestão de serviços de saúde" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <title>Consultin</title>

    <!-- Preload critical resources -->
    <link rel="preload" href="/src/main.tsx" as="script" />
    <link rel="preload" href="/src/index.css" as="style" />
  </head>
  <body>
    <!-- Root element for React -->
    <div id="root"></div>

    <!-- Capacitor bridge initialization -->
    <script>
      // Prevent double tap to zoom on mobile
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - (window.lastTouchEnd || 0) < 300) {
          e.preventDefault();
        }
        window.lastTouchEnd = now;
      }, false);

      // Prevent context menu on long press for native feel
      window.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
    </script>

    <!-- Main entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
